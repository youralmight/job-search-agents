[project]
name = "jobhunting-screen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jobhunting-core"]

[project.scripts]
jobhunting-screen = "jobhunting_screen.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunting_screen"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
jobhunting-core = { workspace = true }
