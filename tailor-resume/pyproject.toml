[project]
name = "jobhunting-tailor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jobhunting-core"]

[project.scripts]
jobhunting-tailor = "jobhunting_tailor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunting_tailor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
jobhunting-core = { workspace = true }
